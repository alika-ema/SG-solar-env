<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installer Dashboard | SolarSG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <nav class="bg-slate-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-solar-panel text-yellow-400 text-2xl"></i>
                <span class="font-bold text-xl">SolarSG <span class="text-xs font-normal text-gray-400">Installer Portal</span></span>
            </div>
            <a href="index.html" class="text-sm bg-slate-700 px-3 py-1 rounded hover:bg-slate-600">Exit</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded shadow border-l-4 border-blue-500">
                <p class="text-sm text-gray-500">Total Leads</p>
                <p class="text-3xl font-bold" id="totalLeads">0</p>
            </div>
            <div class="bg-white p-6 rounded shadow border-l-4 border-green-500">
                <p class="text-sm text-gray-500">Active Groups</p>
                <p class="text-3xl font-bold" id="activeGroups">0</p>
            </div>
            <div class="bg-white p-6 rounded shadow border-l-4 border-purple-500">
                <p class="text-sm text-gray-500">Top Area</p>
                <p class="text-xl font-bold truncate" id="topArea">-</p>
            </div>
            <div class="bg-white p-6 rounded shadow border-l-4 border-yellow-500">
                <p class="text-sm text-gray-500">Pending Contact</p>
                <p class="text-3xl font-bold" id="pendingActions">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Leads Table -->
            <div class="lg:col-span-2 bg-white rounded shadow overflow-hidden">
                <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                    <h2 class="font-bold text-lg">Homeowner Interest (Live)</h2>
                    <span class="text-xs text-gray-500 italic" id="dbStatus">Connecting...</span>
                </div>
                
                <div class="p-4 bg-gray-50 border-b flex gap-2">
                    <select id="areaFilter" onchange="renderLeads()" class="border rounded px-3 py-1 text-sm">
                        <option value="all">All Areas</option>
                        <option value="D09-D11">District 09-11</option>
                        <option value="D10">District 10</option>
                        <option value="D15-D16">District 15-16</option>
                        <option value="D19-D20">District 19-20</option>
                        <option value="D21-D23">District 21-23</option>
                        <option value="D26-D28">District 26-28</option>
                    </select>
                </div>

                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Contact</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Area</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Action</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody" class="bg-white divide-y divide-gray-200">
                        <tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">Waiting for data...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Create Campaign -->
            <div class="bg-white rounded shadow p-6 h-fit">
                <h2 class="font-bold text-lg mb-4 text-green-700">Create Group Buy</h2>
                <form onsubmit="handleCreateGroup(event)" class="space-y-4">
                    <input type="text" id="campaignName" placeholder="Campaign Name" required class="w-full border rounded px-3 py-2">
                    <select id="targetArea" required class="w-full border rounded px-3 py-2">
                        <option value="D10">District 10 (Bukit Timah)</option>
                        <option value="D09-D11">District 09-11</option>
                        <option value="D15-D16">District 15-16</option>
                        <option value="D19-D20">District 19-20</option>
                        <option value="D21-D23">District 21-23</option>
                        <option value="D26-D28">District 26-28</option>
                    </select>
                    <input type="number" id="minParticipants" placeholder="Min Participants" value="10" required class="w-full border rounded px-3 py-2">
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700">Launch Campaign</button>
                </form>

                <div class="mt-8 pt-6 border-t">
                    <h3 class="font-bold text-sm text-gray-700 mb-2">Your Active Campaigns</h3>
                    <div id="activeCampaignsList" class="space-y-2 text-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmUXNY1WtfGRm1xkH_Z1PoEMi2cy-2j2I",
            authDomain: "solarsg-platform.firebaseapp.com",
            projectId: "solarsg-platform",
            storageBucket: "solarsg-platform.firebasestorage.app",
            messagingSenderId: "845541201143",
            appId: "1:845541201143:web:1c0af9329fbfa6cf44eff2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allLeads = [];
        let allCampaigns = [];

        // --- 1. Listen to Leads ---
        console.log("🔍 Listening to collection: 'homeowner_interest'");
        const leadsQuery = query(collection(db, "homeowner_interest"), orderBy("createdAt", "desc"));
        
        onSnapshot(leadsQuery, (snapshot) => {
            console.log(`📥 Received ${snapshot.size} documents from 'homeowner_interest'`);
            document.getElementById('dbStatus').innerText = `Live (${snapshot.size} records)`;
            
            allLeads = [];
            snapshot.forEach((doc) => {
                allLeads.push({ id: doc.id, ...doc.data() });
            });
            updateStats();
            renderLeads();
        }, (error) => {
            console.error("❌ Error listening to leads:", error);
            document.getElementById('dbStatus').innerText = "Error loading data";
            document.getElementById('dbStatus').classList.add('text-red-500');
        });

        // --- 2. Listen to Campaigns ---
        const campaignsQuery = query(collection(db, "group_buy_campaigns"), orderBy("createdAt", "desc"));
        onSnapshot(campaignsQuery, (snapshot) => {
            console.log(`📥 Received ${snapshot.size} documents from 'group_buy_campaigns'`);
            allCampaigns = [];
            snapshot.forEach((doc) => {
                allCampaigns.push({ id: doc.id, ...doc.data() });
            });
            updateStats();
            renderCampaigns();
        });

        // --- Functions ---
        function updateStats() {
            document.getElementById('totalLeads').innerText = allLeads.length;
            document.getElementById('activeGroups').innerText = allCampaigns.length;
            
            if (allLeads.length > 0) {
                const areaCounts = {};
                allLeads.forEach(l => areaCounts[l.area] = (areaCounts[l.area] || 0) + 1);
                const top = Object.keys(areaCounts).reduce((a, b) => areaCounts[a] > areaCounts[b] ? a : b);
                document.getElementById('topArea').innerText = top;
            }
        }

        window.renderLeads = function() {
            const tbody = document.getElementById('leadsTableBody');
            const filter = document.getElementById('areaFilter').value;
            tbody.innerHTML = '';

            const filtered = filter === 'all' ? allLeads : allLeads.filter(l => l.area === filter);

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No leads found.</td></tr>';
                return;
            }

            filtered.forEach(lead => {
                const date = lead.createdAt ? new Date(lead.createdAt.seconds * 1000).toLocaleDateString() : 'Just now';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4">
                            <div class="font-bold">${lead.name}</div>
                            <div class="text-xs text-gray-500">${lead.propertyType}</div>
                        </td>
                        <td class="px-6 py-4 text-sm">
                            <div>${lead.email}</div>
                            <div class="text-gray-500">${lead.phone}</div>
                        </td>
                        <td class="px-6 py-4"><span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">${lead.area}</span></td>
                        <td class="px-6 py-4">
                            <button onclick="navigator.clipboard.writeText('${lead.name}: ${lead.phone}');alert('Copied!')" class="text-blue-600 hover:underline text-sm">Copy Contact</button>
                        </td>
                    </tr>
                `;
            });
        }

        window.renderCampaigns = function() {
            const div = document.getElementById('activeCampaignsList');
            div.innerHTML = '';
            if(allCampaigns.length === 0) {
                div.innerHTML = '<p class="text-gray-500 italic">No active campaigns.</p>';
                return;
            }
            allCampaigns.forEach(c => {
                div.innerHTML += `
                    <div class="bg-gray-50 p-2 rounded border">
                        <div class="font-bold">${c.campaignName}</div>
                        <div class="text-xs text-gray-500">${c.targetArea} | Min: ${c.minParticipants}</div>
                    </div>
                `;
            });
        }

        window.handleCreateGroup = async function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Launching...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "group_buy_campaigns"), {
                    campaignName: document.getElementById('campaignName').value,
                    targetArea: document.getElementById('targetArea').value,
                    minParticipants: parseInt(document.getElementById('minParticipants').value),
                    status: 'active',
                    createdAt: serverTimestamp()
                });
                alert("Campaign Launched!");
                e.target.reset();
            } catch (err) {
                console.error(err);
                alert("Error launching campaign.");
            } finally {
                btn.innerText = "Launch Campaign";
                btn.disabled = false;
            }
        }
        
        // Expose to window
        window.renderLeads = renderLeads;
        window.renderCampaigns = renderCampaigns;
        window.handleCreateGroup = handleCreateGroup;
    </script>
</body>
</html>
