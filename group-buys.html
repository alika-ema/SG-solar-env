<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmUXNY1WtfGRm1xkH_Z1PoEMi2cy-2j2I",
        authDomain: "solarsg-platform.firebaseapp.com",
        projectId: "solarsg-platform",
        storageBucket: "solarsg-platform.firebasestorage.app",
        messagingSenderId: "845541201143",
        appId: "1:845541201143:web:1c0af9329fbfa6cf44eff2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Handle Form Submission
    window.handleSignup = async function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerText;
        btn.innerText = "Submitting...";
        btn.disabled = true;

        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            area: document.getElementById('area').value,
            propertyType: document.getElementById('property').value,
            notes: document.getElementById('notes').value,
            createdAt: serverTimestamp()
        };

        console.log("🚀 Attempting to save data...", formData);

        try {
            // IMPORTANT: Collection name must be exactly 'homeowner_interest'
            const docRef = await addDoc(collection(db, "homeowner_interest"), formData);
            console.log("✅ Success! Document written with ID: ", docRef.id);
            
            // Show success message
            document.getElementById('groupBuyForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            
            // Reset form after 5 seconds
            setTimeout(() => {
                document.getElementById('groupBuyForm').reset();
                document.getElementById('groupBuyForm').style.display = 'block';
                document.getElementById('successMessage').style.display = 'none';
                btn.innerText = originalText;
                btn.disabled = false;
            }, 5000);

        } catch (error) {
            console.error("❌ Error adding document: ", error);
            alert("Error saving data. Check console (F12) for details.");
            btn.innerText = originalText;
            btn.disabled = false;
        }
    };

    // Optional: Live count of groups on the homeowner page
    const q = query(collection(db, "group_buy_campaigns"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        console.log(`📢 Found ${snapshot.size} active group campaigns.`);
        // You can update the UI here to show available groups if you want
    });
</script>
